name = "cloudpulse-monitor"
main = "worker/index.ts"
compatibility_date = "2026-09-11"

# Static Assets for SPA Frontend (Build output in ./dist)
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "app_db"
database_id = "local-development-d1-id"

[[kv_namespaces]]
binding = "CACHE"
id = "local-development-kv-id"
